services:

  chrome:
    image: andrewmackrodt/chromium-x11:latest
    container_name: cyberkiosk-chrome
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - TZ=${TZ}
      - HTTP_PROXY=http://privoxy:8118
      - HTTPS_PROXY=http://privoxy:8118
      - NO_PROXY=cyberkiosk-webapp,localhost,127.0.0.1
    command: >
      --no-sandbox
      --kiosk
      --incognito
      --no-first-run
      --disable-translate
      --disable-sync
      --disable-background-networking
      --disable-default-apps
      --disable-extensions
      --disable-component-extensions-with-background-pages
      --disable-features=TranslateUI
      --disable-popup-blocking
      --disable-prompt-on-repost
      --disable-background-timer-throttling
      --disable-renderer-backgrounding
      --disable-device-discovery-notifications
      --disable-software-rasterizer
      --disable-logging
      http://cyberkiosk-webapp:5000
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - session_data:/data
      - asso_data:/home/ubuntu/Asso:ro
    depends_on:
      - privoxy
      - webapp
    networks:
      - cyberkiosk_net

  webapp:
    build: ./webapp
    container_name: cyberkiosk-webapp
    environment:
      - FLASK_ENV=production
      - TZ=${TZ}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_SUBJECT=${MAIL_SUBJECT}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    volumes:
      - ./privoxy/config:/app/privoxy
      - session_data:/app/session
      - asso_data:/app/asso:ro
    ports:
      - "${WEBAPP_PORT}:5000"
    networks:
      - cyberkiosk_net

  privoxy:
    build: ./privoxy
    container_name: cyberkiosk-privoxy
    ports:
      - "8118:8118"
    volumes:
      - ./privoxy/config:/etc/privoxy
    networks:
      - cyberkiosk_net

volumes:
  session_data:
    driver: local
  asso_data:
    driver: local
    driver_opts:
      type: none
      device: ${ASSO_PATH}
      o: bind

networks:
  cyberkiosk_net:
    driver: bridge

